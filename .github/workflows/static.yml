# Publica en GitHub Pages lo que está en main.
# Antes de publicar comprueba que las páginas armadas coincidan con src/ y que los cálculos
# puros pasen sus pruebas (las de navegador las corre tests.yml). Se sube sólo el sitio:
# los HTML de la raíz y sus imágenes, no src/, tests/, backlog/ ni la documentación.
name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; uno en curso no se cancela.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # ningún paso empuja nada: el token no queda en .git/config

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Las páginas están al día con src/
        run: node src/construir.js --comprobar

      - name: Pruebas unitarias de los cálculos puros
        run: node --test "tests/unidades/*.test.js"

      - name: Armar la carpeta del sitio
        run: node src/sitio.js _sitio

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
